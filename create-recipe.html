<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Recipe - Recipe App</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <div class="container">
      <h1 class="logo">Recipe App</h1>
      <div class="nav-links">
        <a href="login.html" class="button nav-button">Logout</a>
      </div>
    </div>
  </nav>

  <!-- Create Recipe Form -->
  <section class="form-section">
    <div class="form-container">
      <h2>Create a New Recipe</h2>
      <form action="https://receptor-production-5648.up.railway.app/recipes/create" method="POST">
        <label for="title">Recipe Title</label>
        <input type="text" id="title" name="title" placeholder="Enter recipe title" required>

        <label for="ingredients">Ingredients</label>
        <textarea id="ingredients" name="ingredients" rows="5" placeholder="List ingredients" required></textarea>

        <label for="instructions">Instructions</label>
        <textarea id="instructions" name="instructions" rows="7" placeholder="Step by step instructions" required></textarea>

        <button type="submit" class="button submit-button">Create Recipe</button>
      </form>
    </div>
  </section>

  <footer>
    <p>&copy; 2026 Recipe App. All rights reserved.</p>
  </footer>

</body>
</html>
